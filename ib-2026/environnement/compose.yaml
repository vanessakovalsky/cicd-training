# Pile CI/CD de la formation : Jenkins + agent + Gitea + Traefik + Mailpit (+ SonarQube).
# Profil leger (defaut)   : docker compose up -d
# Profil complet (Sonar)  : docker compose --profile complet up -d
name: cicd

services:
  traefik:
    image: traefik:v3.6   # >= 3.6 : compatible Docker Engine 29 (3.3 : fournisseur Docker en erreur)
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=cicd
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - "${TRAEFIK_PORT:-80}:80"   # variable si le port 80 est pris
      - "8090:8080"   # tableau de bord Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-dynamic:/etc/traefik/dynamic
    networks: [cicd]
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1.24
    environment:
      GITEA__server__ROOT_URL: http://localhost:3000/   # URL du navigateur (et du tunnel SSH en cloud)
      GITEA__server__DOMAIN: localhost
      GITEA__server__SSH_PORT: "2222"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
      GITEA__packages__ENABLED: "true"
      GITEA__mailer__ENABLED: "false"
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    networks: [cicd]   # depuis les conteneurs : http://gitea:3000 (reecriture git insteadOf)
    restart: unless-stopped

  jenkins:
    build: ./jenkins
    image: cicd-formation/jenkins:local
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_casc
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?definir JENKINS_ADMIN_PASSWORD dans .env}
    ports:
      - "8080:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./jenkins/casc:/var/jenkins_casc
      - ./secrets:/run/secrets/formation:ro   # cle de l'agent, lue par les rattrapages JCasC
    networks: [cicd]
    restart: unless-stopped

  agent:
    build: ./agent
    image: cicd-formation/agent-python:local
    hostname: agent-python
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${JENKINS_AGENT_SSH_PUBKEY:?lancer scripts/setup/init-env.sh}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # deploiements (risque etudie au module 09)
      - agent-cache:/home/jenkins/.cache
      - traefik-dynamic:/srv/traefik-dynamic
    networks: [cicd]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "8025:8025"   # interface web ; SMTP interne mailpit:1025
    networks: [cicd]
    restart: unless-stopped

  sonarqube:
    image: sonarqube:25.6.0.109173-community
    profiles: [complet]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks: [cicd]
    restart: unless-stopped

networks:
  cicd:
    name: cicd

volumes:
  traefik-dynamic:
  gitea-data:
  jenkins-home:
  agent-cache:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
