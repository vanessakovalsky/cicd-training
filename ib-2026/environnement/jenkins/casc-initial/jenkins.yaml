# Configuration initiale (etat de depart du module 02).
# Les fragments ajoutes par les rattrapages (agent.yaml, gitea.yaml...) completent ce fichier.
jenkins:
  systemMessage: "Jenkins de formation FretExpress - configuration geree par JCasC"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: Administrateur
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  markupFormatter: plainText
unclassified:
  location:
    url: http://localhost:8080/
    adminAddress: jenkins@fretexpress.localhost
  mailer:
    smtpHost: mailpit
    smtpPort: "1025"
  email-ext:
    mailAccount:
      smtpHost: mailpit
      smtpPort: "1025"
    defaultRecipients: equipe@fretexpress.localhost
